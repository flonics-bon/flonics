name: CI

on:
push:
branches: [main, develop]
pull_request:
branches: [main]

jobs:
test:
runs-on: ubuntu-latest
strategy:
matrix:
python-version: ['3.9', '3.10', '3.11']
steps:
- uses: actions/checkout@v3
- name: Set up Python
uses: actions/setup-python@v4
with:
python-version: ${{ matrix.python-version }}
- name: Install dependencies
run: |
pip install -r analytics/requirements.txt
- name: Run tests
run: |
pytest analytics/tests/ --cov=analytics --cov-report=xml
- name: Upload coverage
uses: codecov/codecov-action@v3
with:
file: ./coverage.xml

lint:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- name: Set up Node.js
uses: actions/setup-node@v3
with:
node-version: '18'
- name: Install dependencies
run: npm install -g typescript eslint
- name: Lint TypeScript
run: |
cd analytics
tsc --noEmit

build:
runs-on: ubuntu-latest
needs: [test, lint]
steps:
- uses: actions/checkout@v3
- name: Build Docker image
run: |
docker build -t 4dflow-analytics:latest analytics/4dflow-visualization/
- name: Test Docker image
run: |
docker run -d -p 5000:5000 4dflow-analytics:latest
sleep 5
curl -f http://localhost:5000/health || exit 1