name: Code Quality Check

on:
  push:
    branches: [ "main" ]  # 메인에 푸시될 때도 실행 (테스트용)
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # <--- 이 줄을 추가하면 "Run workflow" 버튼이 생깁니다!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: |
          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "No package.json found, skipping build step."
          fi
