name: Code Quality Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install  # 의존성 설치
      - run: npm run build # 빌드 테스트 (문법/로직 에러 체크)
