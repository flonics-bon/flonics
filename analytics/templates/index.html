<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Flow MRI Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>4D Flow MRI 분석 시스템</h1>
            <p>혈류 속도 및 유량 분석</p>
        </header>
        
        <main>
            <div class="input-section">
                <h2>데이터 입력</h2>
                <div class="form-group">
                    <label for="velocity">속도 데이터 (쉼표로 구분):</label>
                    <input type="text" id="velocity" placeholder="예: 1.2, 1.5, 1.8, 2.0">
                </div>
                
                <div class="form-group">
                    <label for="area">단면적 (cm²):</label>
                    <input type="number" id="area" value="1.0" step="0.1">
                </div>
                
                <button onclick="analyzeFlow()">분석 시작</button>
            </div>
            
            <div class="result-section" id="results" style="display: none;">
                <h2>분석 결과</h2>
                <div class="result-grid">
                    <div class="result-item">
                        <span class="label">평균 속도:</span>
                        <span class="value" id="meanVelocity">-</span>
                        <span class="unit">cm/s</span>
                    </div>
                    <div class="result-item">
                        <span class="label">최대 속도:</span>
                        <span class="value" id="maxVelocity">-</span>
                        <span class="unit">cm/s</span>
                    </div>
                    <div class="result-item">
                        <span class="label">유량:</span>
                        <span class="value" id="flowRate">-</span>
                        <span class="unit">cm³/s</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
