<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Flow MRI 분석</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>4D Flow MRI 분석 도구</h1>
        
        <div class="section">
            <h2>속도 데이터 분석</h2>
            <textarea id="velocityInput" placeholder="속도 데이터를 입력하세요 (쉼표로 구분)"></textarea>
            <button onclick="analyzeVelocity()">분석하기</button>
            <div id="velocityResults" class="results"></div>
        </div>
        
        <div class="section">
            <h2>3D 유동 메트릭</h2>
            <div class="input-group">
                <label>Vx:</label>
                <input type="text" id="vxInput" placeholder="X 방향 속도">
            </div>
            <div class="input-group">
                <label>Vy:</label>
                <input type="text" id="vyInput" placeholder="Y 방향 속도">
            </div>
            <div class="input-group">
                <label>Vz:</label>
                <input type="text" id="vzInput" placeholder="Z 방향 속도">
            </div>
            <button onclick="analyzeFlow()">유동 분석</button>
            <div id="flowResults" class="results"></div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
