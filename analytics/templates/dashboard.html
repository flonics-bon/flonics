<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4D Flow Analytics Dashboard</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#1a1a1a;color:#fff}
.container{display:grid;grid-template-columns:300px 1fr;height:100vh}
.sidebar{background:#2a2a2a;padding:20px}
.main{padding:20px}
canvas{width:100%;height:600px;background:#000}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.metric-card{background:#2a2a2a;padding:20px;border-radius:8px}
.metric-value{font-size:32px;font-weight:bold;color:#4CAF50}
button{background:#4CAF50;color:#fff;border:none;padding:10px 20px;cursor:pointer;border-radius:4px;margin:5px}
button:hover{background:#45a049}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<h2>Controls</h2>
<button id="loadBtn">Load Data</button>
<button id="analyzeBtn">Analyze</button>
<button id="exportBtn">Export</button>
</div>
<div class="main">
<h1>4D Flow Visualization</h1>
<canvas id="canvas"></canvas>
<div class="metrics">
<div class="metric-card">
<div>Flow Rate</div>
<div class="metric-value" id="flowRate">0.00</div>
</div>
<div class="metric-card">
<div>Max Velocity</div>
<div class="metric-value" id="maxVelocity">0.00</div>
</div>
<div class="metric-card">
<div>WSS Peak</div>
<div class="metric-value" id="wssPeak">0.00</div>
</div>
</div>
</div>
</div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
