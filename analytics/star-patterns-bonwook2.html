<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재밌는 별찍기 패턴 - bonwook2</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        
        .control-group {
            margin: 10px 0;
        }
        
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            color: #333;
        }
        
        select, input {
            padding: 8px;
            border-radius: 5px;
            border: 2px solid #667eea;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .output-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 90%;
            overflow-x: auto;
        }
        
        .pattern {
            color: #ffd700;
            font-size: 18px;
            line-height: 1.4;
            white-space: pre;
            text-align: center;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700; }
            50% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ffd700; }
        }
        
        .rainbow {
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <h1>✨ 재밌는 별찍기 패턴 생성기 ✨</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>패턴 선택:</label>
            <select id="patternType">
                <option value="pyramid">피라미드</option>
                <option value="diamond">다이아몬드</option>
                <option value="heart">하트</option>
                <option value="christmas">크리스마스 트리</option>
                <option value="spiral">나선형</option>
                <option value="wave">웨이브</option>
                <option value="butterfly">나비</option>
                <option value="rocket">로켓</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>크기:</label>
            <input type="number" id="size" value="7" min="3" max="15">
        </div>
        
        <div class="control-group">
            <label>별 문자:</label>
            <input type="text" id="starChar" value="★" maxlength="2">
        </div>
        
        <div class="control-group">
            <button onclick="generatePattern()">생성하기 🎨</button>
            <button onclick="randomPattern()">랜덤 패턴 🎲</button>
            <button onclick="animatePattern()">애니메이션 ✨</button>
        </div>
    </div>
    
    <div class="output-container">
        <div id="output" class="pattern"></div>
    </div>
    
    <script>
        function generatePattern() {
            const type = document.getElementById('patternType').value;
            const size = parseInt(document.getElementById('size').value);
            const star = document.getElementById('starChar').value || '★';
            
            let pattern = '';
            
            switch(type) {
                case 'pyramid':
                    pattern = createPyramid(size, star);
                    break;
                case 'diamond':
                    pattern = createDiamond(size, star);
                    break;
                case 'heart':
                    pattern = createHeart(size, star);
                    break;
                case 'christmas':
                    pattern = createChristmasTree(size, star);
                    break;
                case 'spiral':
                    pattern = createSpiral(size, star);
                    break;
                case 'wave':
                    pattern = createWave(size, star);
                    break;
                case 'butterfly':
                    pattern = createButterfly(size, star);
                    break;
                case 'rocket':
                    pattern = createRocket(size, star);
                    break;
            }
            
            document.getElementById('output').innerHTML = pattern;
        }
        
        function createPyramid(n, star) {
            let result = '';
            for (let i = 1; i <= n; i++) {
                result += ' '.repeat(n - i) + star.repeat(2 * i - 1) + '\n';
            }
            return result;
        }
        
        function createDiamond(n, star) {
            let result = '';
            // 상단
            for (let i = 1; i <= n; i++) {
                result += ' '.repeat(n - i) + star.repeat(2 * i - 1) + '\n';
            }
            // 하단
            for (let i = n - 1; i >= 1; i--) {
                result += ' '.repeat(n - i) + star.repeat(2 * i - 1) + '\n';
            }
            return result;
        }
        
        function createHeart(n, star) {
            let result = '';
            const size = n * 2;
            
            // 상단 곡선
            for (let i = size / 2; i < size; i += 2) {
                for (let j = 1; j < size - i; j += 2) {
                    result += ' ';
                }
                for (let j = 1; j <= i; j++) {
                    result += star;
                }
                for (let j = 1; j <= size - i; j++) {
                    result += ' ';
                }
                for (let j = 1; j <= i; j++) {
                    result += star;
                }
                result += '\n';
            }
            
            // 하단 삼각형
            for (let i = size; i >= 1; i--) {
                for (let j = i; j < size; j++) {
                    result += ' ';
                }
                for (let j = 1; j <= (i * 2) - 1; j++) {
                    result += star;
                }
                result += '\n';
            }
            return result;
        }
        
        function createChristmasTree(n, star) {
            let result = '';
            // 별
            result += ' '.repeat(n) + '⭐' + '\n';
            
            // 트리
            for (let i = 1; i <= n; i++) {
                result += ' '.repeat(n - i) + star.repeat(2 * i - 1) + '\n';
            }
            
            // 기둥
            const trunkWidth = Math.max(1, Math.floor(n / 3));
            for (let i = 0; i < 2; i++) {
                result += ' '.repeat(n - trunkWidth) + '█'.repeat(trunkWidth * 2) + '\n';
            }
            return result;
        }
        
        function createSpiral(n, star) {
            const size = n * 2 + 1;
            const grid = Array(size).fill().map(() => Array(size).fill(' '));
            
            let x = Math.floor(size / 2);
            let y = Math.floor(size / 2);
            let dx = 0, dy = -1;
            
            for (let i = 0; i < size * size; i++) {
                if ((-size / 2 <= x && x <= size / 2) && (-size / 2 <= y && y <= size / 2)) {
                    if (i % 2 === 0) grid[y + Math.floor(size / 2)][x + Math.floor(size / 2)] = star;
                }
                
                if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
                    [dx, dy] = [-dy, dx];
                }
                x += dx;
                y += dy;
            }
            
            return grid.map(row => row.join('')).join('\n');
        }
        
        function createWave(n, star) {
            let result = '';
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n * 3; j++) {
                    const wave = Math.sin((j + i) * 0.5) * (n / 2) + (n / 2);
                    if (Math.abs(i - wave) < 0.5) {
                        result += star;
                    } else {
                        result += ' ';
                    }
                }
                result += '\n';
            }
            return result;
        }
        
        function createButterfly(n, star) {
            let result = '';
            const size = n * 2;
            
            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size * 2; j++) {
                    const centerDist = Math.abs(j - size);
                    const vertDist = Math.abs(i - size / 2);
                    
                    if (centerDist < 2 || 
                        (centerDist > 5 && centerDist < size - 2 && 
                         vertDist < size / 2 - Math.abs(centerDist - size / 2) / 2)) {
                        result += star;
                    } else {
                        result += ' ';
                    }
                }
                result += '\n';
            }
            return result;
        }
        
        function createRocket(n, star) {
            let result = '';
            
            // 꼭대기
            for (let i = 1; i <= n / 2; i++) {
                result += ' '.repeat(n - i) + star.repeat(i) + '\n';
            }
            
            // 몸통
            for (let i = 0; i < n; i++) {
                result += ' '.repeat(n / 2) + '█'.repeat(n) + '\n';
            }
            
            // 날개
            result += star.repeat(n / 2) + '█'.repeat(n) + star.repeat(n / 2) + '\n';
            
            // 불꽃
            for (let i = 0; i < 3; i++) {
                result += ' '.repeat(n / 2 + i) + '🔥'.repeat(n - i * 2) + '\n';
            }
            
            return result;
        }
        
        function randomPattern() {
            const patterns = ['pyramid', 'diamond', 'heart', 'christmas', 'spiral', 'wave', 'butterfly', 'rocket'];
            const stars = ['★', '⭐', '✨', '💫', '🌟', '⚡', '💎', '🔷'];
            
            document.getElementById('patternType').value = patterns[Math.floor(Math.random() * patterns.length)];
            document.getElementById('size').value = Math.floor(Math.random() * 8) + 5;
            document.getElementById('starChar').value = stars[Math.floor(Math.random() * stars.length)];
            
            generatePattern();
        }
        
        let animationInterval;
        function animatePattern() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
                return;
            }
            
            const patterns = ['pyramid', 'diamond', 'heart', 'christmas', 'spiral', 'wave', 'butterfly', 'rocket'];
            let index = 0;
            
            animationInterval = setInterval(() => {
                document.getElementById('patternType').value = patterns[index];
                generatePattern();
                index = (index + 1) % patterns.length;
            }, 1500);
        }
        
        // 초기 패턴 생성
        generatePattern();
    </script>
</body>
</html>
