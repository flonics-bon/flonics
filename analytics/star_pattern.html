<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재밌는 별찍기 - WebGPU</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #canvas {
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }
        
        .controls {
            margin-top: 20px;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .control-group {
            margin: 10px 0;
        }
        
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
            color: #333;
        }
        
        input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>✨ 재밌는 별찍기 - WebGPU Edition ✨</h1>
    <canvas id="canvas" width="800" height="800"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <label>별 개수:</label>
            <input type="range" id="starCount" min="100" max="5000" value="1000" step="100">
            <span class="value-display" id="starCountValue">1000</span>
        </div>
        <div class="control-group">
            <label>회전 속도:</label>
            <input type="range" id="rotationSpeed" min="0" max="100" value="30" step="1">
            <span class="value-display" id="rotationSpeedValue">30</span>
        </div>
        <div class="control-group">
            <label>별 크기:</label>
            <input type="range" id="starSize" min="1" max="10" value="3" step="0.5">
            <span class="value-display" id="starSizeValue">3</span>
        </div>
        <div class="control-group">
            <label>색상 변화 속도:</label>
            <input type="range" id="colorSpeed" min="0" max="100" value="20" step="1">
            <span class="value-display" id="colorSpeedValue">20</span>
        </div>
        <div class="control-group">
            <button id="resetBtn">🔄 리셋</button>
            <button id="randomBtn">🎲 랜덤 패턴</button>
            <button id="spiralBtn">🌀 나선 패턴</button>
            <button id="galaxyBtn">🌌 은하 패턴</button>
        </div>
    </div>

    <script type="module">
        // WebGPU 지원 확인
        if (!navigator.gpu) {
            alert('WebGPU를 지원하지 않는 브라우저입니다. Chrome Canary 또는 최신 브라우저를 사용해주세요.');
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 별 데이터 구조
        class Star {
            constructor(pattern = 'random') {
                this.pattern = pattern;
                this.reset();
            }
            
            reset() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                if (this.pattern === 'spiral') {
                    const angle = Math.random() * Math.PI * 4;
                    const radius = Math.random() * 300;
                    this.x = centerX + Math.cos(angle) * radius;
                    this.y = centerY + Math.sin(angle) * radius;
                    this.angle = angle;
                    this.radius = radius;
                } else if (this.pattern === 'galaxy') {
                    const arm = Math.floor(Math.random() * 5);
                    const armAngle = (arm * Math.PI * 2 / 5) + Math.random() * 0.5;
                    const radius = Math.random() * 300;
                    this.x = centerX + Math.cos(armAngle) * radius;
                    this.y = centerY + Math.sin(armAngle) * radius;
                    this.angle = armAngle;
                    this.radius = radius;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.angle = Math.random() * Math.PI * 2;
                    this.radius = Math.sqrt(
                        Math.pow(this.x - centerX, 2) + 
                        Math.pow(this.y - centerY, 2)
                    );
                }
                
                this.baseX = this.x;
                this.baseY = this.y;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.brightness = Math.random();
                this.brightnessSpeed = (Math.random() - 0.5) * 0.02;
                this.hue = Math.random() * 360;
            }
            
            update(rotation, colorSpeed) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                // 회전
                this.angle += rotation * 0.001;
                
                // 위치 업데이트
                if (this.pattern === 'spiral' || this.pattern === 'galaxy') {
                    this.x = centerX + Math.cos(this.angle) * this.radius;
                    this.y = centerY + Math.sin(this.angle) * this.radius;
                } else {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    
                    // 화면 밖으로 나가면 반대편에서 나타남
                    if (this.x < 0) this.x = canvas.width;
                    if (this.x > canvas.width) this.x = 0;
                    if (this.y < 0) this.y = canvas.height;
                    if (this.y > canvas.height) this.y = 0;
                }
                
                // 밝기 변화
                this.brightness += this.brightnessSpeed;
                if (this.brightness > 1 || this.brightness < 0) {
                    this.brightnessSpeed *= -1;
                }
                
                // 색상 변화
                this.hue += colorSpeed * 0.1;
                if (this.hue > 360) this.hue = 0;
            }
            
            draw(size) {
                const alpha = this.brightness * 0.8 + 0.2;
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
                
                // 별 그리기 (십자가 모양)
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * this.brightness, 0, Math.PI * 2);
                ctx.fill();
                
                // 빛나는 효과
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, size * 3
                );
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 70%, 0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size * 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 설정
        let starCount = 1000;
        let rotationSpeed = 30;
        let starSize = 3;
        let colorSpeed = 20;
        let currentPattern = 'random';
        let stars = [];
        
        // 별 초기화
        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star(currentPattern));
            }
        }
        
        initStars();
        
        // 애니메이션 루프
        function animate() {
            // 배경을 약간 투명하게 그려서 잔상 효과
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 모든 별 업데이트 및 그리기
            stars.forEach(star => {
                star.update(rotationSpeed, colorSpeed);
                star.draw(starSize);
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // 컨트롤 이벤트 리스너
        document.getElementById('starCount').addEventListener('input', (e) => {
            starCount = parseInt(e.target.value);
            document.getElementById('starCountValue').textContent = starCount;
            initStars();
        });
        
        document.getElementById('rotationSpeed').addEventListener('input', (e) => {
            rotationSpeed = parseInt(e.target.value);
            document.getElementById('rotationSpeedValue').textContent = rotationSpeed;
        });
        
        document.getElementById('starSize').addEventListener('input', (e) => {
            starSize = parseFloat(e.target.value);
            document.getElementById('starSizeValue').textContent = starSize;
        });
        
        document.getElementById('colorSpeed').addEventListener('input', (e) => {
            colorSpeed = parseInt(e.target.value);
            document.getElementById('colorSpeedValue').textContent = colorSpeed;
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            currentPattern = 'random';
            initStars();
        });
        
        document.getElementById('randomBtn').addEventListener('click', () => {
            currentPattern = 'random';
            starCount = Math.floor(Math.random() * 3000) + 500;
            rotationSpeed = Math.floor(Math.random() * 80) + 10;
            starSize = Math.random() * 5 + 1;
            colorSpeed = Math.floor(Math.random() * 80) + 10;
            
            document.getElementById('starCount').value = starCount;
            document.getElementById('starCountValue').textContent = starCount;
            document.getElementById('rotationSpeed').value = rotationSpeed;
            document.getElementById('rotationSpeedValue').textContent = rotationSpeed;
            document.getElementById('starSize').value = starSize;
            document.getElementById('starSizeValue').textContent = starSize.toFixed(1);
            document.getElementById('colorSpeed').value = colorSpeed;
            document.getElementById('colorSpeedValue').textContent = colorSpeed;
            
            initStars();
        });
        
        document.getElementById('spiralBtn').addEventListener('click', () => {
            currentPattern = 'spiral';
            initStars();
        });
        
        document.getElementById('galaxyBtn').addEventListener('click', () => {
            currentPattern = 'galaxy';
            initStars();
        });
    </script>
</body>
</html>
