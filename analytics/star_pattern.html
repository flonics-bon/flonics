<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재밌는 별찍기 - WebGPU</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        #canvas {
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #000;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info {
            color: white;
            margin-top: 15px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <h1>✨ 재밌는 별찍기 WebGPU ✨</h1>
    <canvas id="canvas" width="800" height="800"></canvas>
    
    <div class="controls">
        <button onclick="drawSpiral()">🌀 나선형 별</button>
        <button onclick="drawCircle()">⭕ 원형 별</button>
        <button onclick="drawHeart()">❤️ 하트 별</button>
        <button onclick="drawGalaxy()">🌌 은하수</button>
        <button onclick="drawFirework()">🎆 폭죽</button>
        <button onclick="drawRainbow()">🌈 무지개 별</button>
        <button onclick="clearCanvas()">🗑️ 지우기</button>
    </div>
    
    <div class="info">
        <p>WebGPU를 사용한 인터랙티브 별찍기 프로그램</p>
        <p>버튼을 클릭하여 다양한 패턴을 즐겨보세요!</p>
    </div>

    <script type="module">
        let device, context, pipeline, vertexBuffer;
        let stars = [];
        
        async function init() {
            const canvas = document.getElementById('canvas');
            
            if (!navigator.gpu) {
                alert('WebGPU를 지원하지 않는 브라우저입니다. Chrome Canary를 사용해주세요.');
                return;
            }
            
            const adapter = await navigator.gpu.requestAdapter();
            device = await adapter.requestDevice();
            
            context = canvas.getContext('webgpu');
            const format = navigator.gpu.getPreferredCanvasFormat();
            
            context.configure({
                device: device,
                format: format,
                alphaMode: 'premultiplied',
            });
            
            const shaderCode = `
                struct VertexOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) color: vec4<f32>,
                }
                
                @vertex
                fn vertexMain(@location(0) pos: vec2<f32>, @location(1) color: vec4<f32>) -> VertexOutput {
                    var output: VertexOutput;
                    output.position = vec4<f32>(pos, 0.0, 1.0);
                    output.color = color;
                    return output;
                }
                
                @fragment
                fn fragmentMain(@location(0) color: vec4<f32>) -> @location(0) vec4<f32> {
                    return color;
                }
            `;
            
            const shaderModule = device.createShaderModule({ code: shaderCode });
            
            pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vertexMain',
                    buffers: [{
                        arrayStride: 24,
                        attributes: [
                            { shaderLocation: 0, offset: 0, format: 'float32x2' },
                            { shaderLocation: 1, offset: 8, format: 'float32x4' },
                        ],
                    }],
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fragmentMain',
                    targets: [{ format: format }],
                },
                primitive: {
                    topology: 'triangle-list',
                },
            });
            
            console.log('WebGPU 초기화 완료!');
        }
        
        function createStar(x, y, size, r, g, b, a) {
            const vertices = [];
            const points = 5;
            const outerRadius = size;
            const innerRadius = size * 0.4;
            
            for (let i = 0; i < points * 2; i++) {
                const angle = (Math.PI * i) / points - Math.PI / 2;
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const px = x + Math.cos(angle) * radius;
                const py = y + Math.sin(angle) * radius;
                
                if (i > 1) {
                    vertices.push(x, y, r, g, b, a);
                    vertices.push(
                        x + Math.cos((Math.PI * (i - 1)) / points - Math.PI / 2) * ((i - 1) % 2 === 0 ? outerRadius : innerRadius),
                        y + Math.sin((Math.PI * (i - 1)) / points - Math.PI / 2) * ((i - 1) % 2 === 0 ? outerRadius : innerRadius),
                        r, g, b, a
                    );
                    vertices.push(px, py, r, g, b, a);
                }
            }
            
            return vertices;
        }
        
        function render() {
            if (stars.length === 0) return;
            
            const vertexData = new Float32Array(stars.flat());
            
            if (vertexBuffer) vertexBuffer.destroy();
            vertexBuffer = device.createBuffer({
                size: vertexData.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(vertexBuffer, 0, vertexData);
            
            const commandEncoder = device.createCommandEncoder();
            const textureView = context.getCurrentTexture().createView();
            
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: textureView,
                    clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });
            
            renderPass.setPipeline(pipeline);
            renderPass.setVertexBuffer(0, vertexBuffer);
            renderPass.draw(vertexData.length / 6);
            renderPass.end();
            
            device.queue.submit([commandEncoder.finish()]);
        }
        
        window.drawSpiral = function() {
            stars = [];
            const centerX = 0;
            const centerY = 0;
            const turns = 5;
            const starsCount = 50;
            
            for (let i = 0; i < starsCount; i++) {
                const t = i / starsCount;
                const angle = t * turns * Math.PI * 2;
                const radius = t * 0.8;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                const size = 0.03 + t * 0.02;
                const hue = t * 360;
                const rgb = hslToRgb(hue, 100, 50);
                
                stars.push(createStar(x, y, size, rgb[0], rgb[1], rgb[2], 1.0));
            }
            render();
        };
        
        window.drawCircle = function() {
            stars = [];
            const centerX = 0;
            const centerY = 0;
            const starsCount = 30;
            const radius = 0.7;
            
            for (let i = 0; i < starsCount; i++) {
                const angle = (i / starsCount) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                const hue = (i / starsCount) * 360;
                const rgb = hslToRgb(hue, 100, 50);
                
                stars.push(createStar(x, y, 0.04, rgb[0], rgb[1], rgb[2], 1.0));
            }
            render();
        };
        
        window.drawHeart = function() {
            stars = [];
            const starsCount = 50;
            
            for (let i = 0; i < starsCount; i++) {
                const t = (i / starsCount) * Math.PI * 2;
                const x = 0.5 * (16 * Math.pow(Math.sin(t), 3)) / 20;
                const y = -0.5 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 20;
                
                stars.push(createStar(x, y, 0.03, 1.0, 0.2, 0.5, 1.0));
            }
            render();
        };
        
        window.drawGalaxy = function() {
            stars = [];
            const arms = 3;
            const starsPerArm = 30;
            
            for (let arm = 0; arm < arms; arm++) {
                for (let i = 0; i < starsPerArm; i++) {
                    const t = i / starsPerArm;
                    const angle = (arm * Math.PI * 2 / arms) + t * Math.PI * 4;
                    const radius = t * 0.8;
                    const x = Math.cos(angle) * radius + (Math.random() - 0.5) * 0.1;
                    const y = Math.sin(angle) * radius + (Math.random() - 0.5) * 0.1;
                    const size = 0.015 + Math.random() * 0.02;
                    const brightness = 0.5 + Math.random() * 0.5;
                    
                    stars.push(createStar(x, y, size, brightness, brightness, 1.0, 0.8));
                }
            }
            render();
        };
        
        window.drawFirework = function() {
            stars = [];
            const bursts = 5;
            const starsPerBurst = 20;
            
            for (let b = 0; b < bursts; b++) {
                const centerX = (Math.random() - 0.5) * 1.2;
                const centerY = (Math.random() - 0.5) * 1.2;
                const hue = Math.random() * 360;
                
                for (let i = 0; i < starsPerBurst; i++) {
                    const angle = (i / starsPerBurst) * Math.PI * 2;
                    const radius = 0.2 + Math.random() * 0.15;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    const rgb = hslToRgb(hue, 100, 50);
                    
                    stars.push(createStar(x, y, 0.025, rgb[0], rgb[1], rgb[2], 0.9));
                }
            }
            render();
        };
        
        window.drawRainbow = function() {
            stars = [];
            const layers = 7;
            const starsPerLayer = 15;
            
            for (let layer = 0; layer < layers; layer++) {
                const radius = 0.3 + layer * 0.08;
                const hue = (layer / layers) * 360;
                const rgb = hslToRgb(hue, 100, 50);
                
                for (let i = 0; i < starsPerLayer; i++) {
                    const angle = Math.PI + (i / starsPerLayer) * Math.PI;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius * 0.7;
                    
                    stars.push(createStar(x, y, 0.03, rgb[0], rgb[1], rgb[2], 1.0));
                }
            }
            render();
        };
        
        window.clearCanvas = function() {
            stars = [];
            const commandEncoder = device.createCommandEncoder();
            const textureView = context.getCurrentTexture().createView();
            
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: textureView,
                    clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });
            renderPass.end();
            
            device.queue.submit([commandEncoder.finish()]);
        };
        
        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [f(0), f(8), f(4)];
        }
        
        init().then(() => {
            drawSpiral();
        });
    </script>
</body>
</html>
