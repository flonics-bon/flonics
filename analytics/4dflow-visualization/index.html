<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4D Flow Visualization</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>4D Flow Visualization</h1>
<p>실시간 혈류 데이터 시각화</p>
</header>
<main>
<div class="controls">
<button id="startBtn">시작</button>
<button id="pauseBtn">일시정지</button>
<button id="resetBtn">초기화</button>
<label>속도: <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1"></label>
<label>입자 수: <input type="range" id="particleSlider" min="100" max="5000" step="100" value="1000"></label>
</div>
<canvas id="flowCanvas" width="800" height="600"></canvas>
<div class="info">
<div class="stat">
<span>현재 속도:</span>
<span id="currentSpeed">0</span>
</div>
<div class="stat">
<span>입자 수:</span>
<span id="particleCount">1000</span>
</div>
<div class="stat">
<span>FPS:</span>
<span id="fps">0</span>
</div>
</div>
</main>
</div>
<script src="flowVisualization.js"></script>
</body>
</html>
