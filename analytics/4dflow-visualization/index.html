<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Flow MRI Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #canvas {
            flex: 1;
            display: block;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #00d4ff;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover {
            background: #00a8cc;
        }
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
        }
        .value-display {
            color: #00d4ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div id="controls">
            <h2 style="margin-top: 0; color: #00d4ff;">4D Flow MRI Controls</h2>
            
            <div class="control-group">
                <label>Time Phase: <span class="value-display" id="timeValue">0</span></label>
                <input type="range" id="timeSlider" min="0" max="20" value="0" step="1">
            </div>
            
            <div class="control-group">
                <label>Velocity Threshold: <span class="value-display" id="velocityValue">0.5</span></label>
                <input type="range" id="velocitySlider" min="0" max="1" value="0.5" step="0.01">
            </div>
            
            <div class="control-group">
                <label>Particle Density: <span class="value-display" id="densityValue">5000</span></label>
                <input type="range" id="densitySlider" min="1000" max="10000" value="5000" step="500">
            </div>
            
            <div class="control-group">
                <label>Flow Speed: <span class="value-display" id="speedValue">1.0</span></label>
                <input type="range" id="speedSlider" min="0.1" max="3" value="1.0" step="0.1">
            </div>
            
            <div>
                <button id="playBtn">Play</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
        
        <div id="info">
            <div>FPS: <span class="value-display" id="fps">0</span></div>
            <div>Particles: <span class="value-display" id="particleCount">0</span></div>
            <div>WebGPU: <span class="value-display" id="webgpuStatus">Checking...</span></div>
        </div>
    </div>
    
    <script type="module" src="./flowVisualization.js"></script>
</body>
</html>
