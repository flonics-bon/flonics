version: '3.8'

services:
  4dflow-viz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flonics-4dflow-visualization
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./flowVisualization.js:/usr/share/nginx/html/flowVisualization.js:ro
      - ./README.md:/usr/share/nginx/html/README.md:ro
    networks:
      - flonics-network
    labels:
      - "com.flonics.description=4D Flow MRI WebGPU Visualization"
      - "com.flonics.version=1.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  flonics-network:
    driver: bridge
    name: flonics-network

volumes:
  nginx-cache:
    driver: local
