<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Flow MRI Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
        }
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 20px;
            background: #2a2a2a;
            border-bottom: 2px solid #3a3a3a;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #controls {
            padding: 15px;
            background: #2a2a2a;
            border-top: 2px solid #3a3a3a;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #357abd;
        }
        #info {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>4D Flow MRI Visualization</h1>
        </div>
        <div id="canvas-container">
            <canvas id="renderCanvas"></canvas>
        </div>
        <div id="controls">
            <button id="startBtn">시작</button>
            <button id="stopBtn">정지</button>
            <button id="resetBtn">리셋</button>
            <div id="info">WebGPU 초기화 중...</div>
        </div>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
